services:
  db:
    image: mysql:8.0
    container_name: rental-desk-db
    env_file: .env
    environment:
      MYSQL_DATABASE: rental_desk
      TZ: Asia/Tokyo
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
