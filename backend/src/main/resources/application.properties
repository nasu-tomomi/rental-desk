spring.application.name=rental-desk
# Run from backend/. OS environment variables can override values in .env.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?connectionTimeZone=Asia/Tokyo&forceConnectionTimeZoneToSession=true
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:${MYSQL_ROOT_PASSWORD}}
# Existing schema and seed are managed manually. Never run SQL at startup.
spring.sql.init.mode=never
server.address=127.0.0.1
server.error.include-message=never
server.error.include-stacktrace=never
